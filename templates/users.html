{% extends "base.html" %}
{% block title %}المستخدمون{% endblock %}
{% block content %}
<div class="page-head"><h1>إدارة المستخدمين</h1></div>
<form method="post" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="row">
    <label>الاسم الكامل<input name="full_name" required></label>
    <label>اسم المستخدم<input name="username" required></label>
    <label>كلمة المرور<input name="password" type="password" minlength="6" required></label>
    <label>الصلاحية<select name="role">{% for k, v in ROLES.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></label>
  </div>
  <button class="btn">إضافة مستخدم</button>
</form>
<div class="card"><table>
  <tr><th>الاسم</th><th>المستخدم</th><th>الصلاحية</th><th></th></tr>
  {% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.username }}</td><td>{{ ROLES[u.role] }}</td><td>
    {% if u.id != g.user.id %}<form method="post" action="{{ url_for('user_delete', uid=u.id) }}" onsubmit="return confirm('حذف المستخدم؟')">
      <input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="btn danger sm">حذف</button></form>{% endif %}</td></tr>{% endfor %}
</table></div>
{% endblock %}
