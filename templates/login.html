{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="login-wrap">
  <form method="post" class="card login">
    <img class="login-logo" src="{{ url_for('static', filename='logo.png') }}" alt="وزارة التعليم">
    <h1>نظام الوثائق والمحفوظات</h1>
    <p class="muted">إدارة التعليم بمنطقة حائل</p>
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>اسم المستخدم<input name="username" required autofocus autocomplete="username"></label>
    <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn block">دخول</button>
  </form>
</div>
{% endblock %}
